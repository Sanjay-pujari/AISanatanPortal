<section class="feature-highlights-section">
  <div class="container">
    <h2 class="section-title">{{ 'starting.features.title' | translate }}</h2>
    <p class="section-subtitle">{{ 'starting.features.subtitle' | translate }}</p>
    
    <div class="features-grid">
      <div *ngFor="let feature of features" class="feature-card custom-card">
        <div class="feature-icon">
          <mat-icon color="primary">{{ feature.icon }}</mat-icon>
        </div>
        <h3>{{ feature.titleKey | translate }}</h3>
        <p>{{ feature.descriptionKey | translate }}</p>
      </div>
    </div>
  </div>
</section>
